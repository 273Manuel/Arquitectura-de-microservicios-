services:
  productos:
    build: ./services/productos
    ports:
      - "8001:8001"
  clientes:
    build: ./services/clientes
    ports:
      - "8002:8002"
  pedidos:
    build: ./services/pedidos
    environment:
      CLIENTES_URL: http://clientes:8002
      PRODUCTOS_URL: http://productos:8001
    ports:
      - "8003:8003"
    depends_on:
      - productos
      - clientes
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    expose:
      - "5173"
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - productos
      - clientes
      - pedidos
  workspace:
    image: mcr.microsoft.com/devcontainers/universal:2
    command: sleep infinity
    volumes:
      - .:/workspaces:cached
