[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:productos]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/services/productos
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:clientes]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8002
directory=/app/services/clientes
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pedidos]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8003
directory=/app/services/pedidos
environment=CLIENTES_URL="http://127.0.0.1:8002",PRODUCTOS_URL="http://127.0.0.1:8001"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
